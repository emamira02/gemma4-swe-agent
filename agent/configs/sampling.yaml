# S8: the sampling of the public Budget-Fit configuration (mean ~10/58 public tasks over ten draws, the most
# replicated public result): temperature 0.2, top_p 0.95, 8,192 output tokens, thinking on with a 4,096-token budget.
# S4-S7 used temperature 1.0 and a 1,024 budget to fit 5-minute sessions; with 8 minutes that trade-off no longer
# applies. Thinking stays on (disabling it costs 16-28 of 129 tasks in public ablations). No thinking_level (maps to
# reasoning_effort on vLLM) and no top_k (dropped by LiteLLM for OpenAI-compatible endpoints).
temperature: 0.2
top_p: 0.95
max_output_tokens: 8192
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
