# Scoring runs tasks one at a time on 4xL4; 12 h for ~120 tasks including sandbox setup, excluding patch validation.
# S8: the scorer-proven public Budget-Fit budget (8 min, 28 counted calls, 80 turns, 240 s per command), scored in
# ten public draws without exceeding 12 h (tools/build_submission.py PROVEN_BUDGET). S1-S7 used 5.0 min / 32 calls /
# 60 turns / 100 s from a worst-case rule (120 x cap) that ignored sessions ending early at submit_patch.
# The dev panel's mean task time x 120 must stay <= 11 h (decision rule in RESUME.md).
evaluation:
  max_time_minutes: 8.0
  timeout_seconds: 240
  max_tool_calls: 28
  max_turns: 80
