# Scoring runs tasks one at a time on 4xL4 with a 12 h limit for ~120 tasks including ~0.5 min setup per task.
# 120 x (5.0 + 0.5) min = 11.0 h (+ ~0.2 h server start) -> ~0.8 h margin; the S7 dev panel measured 8.6 h.
# 32 tool calls: the harness adds a "finalize soon" warning to every tool result once 22 are used.
# timeout_seconds is also the hidden-test timeout (swegemma harness/verification.py); 240 s, the scorer-proven
# public value, so a slow test file (one requests file runs 72 s in kernels/gold_check) cannot fail a correct patch.
# No agent command reached 100 s in the S7 or S8 panels, so inside sessions this changes nothing measured.
evaluation:
  max_time_minutes: 5.0
  timeout_seconds: 240
  max_tool_calls: 32
  max_turns: 60
