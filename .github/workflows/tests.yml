name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.3.5 pytest==9.1.1
      # synthetic fixtures only: competition data is never in the repository
      - run: python -m pytest -q tests/test_locstudy.py
      - run: python kernels/build_v2.py   # the Kaggle script must always build and compile
